# release.yml — 完整构建并打包 release artifact
#
# 触发:
#   - 手动触发 (workflow_dispatch,可选 tag)
#   - push tag v* (打 tag 即发版)
#
# 作业流:
#   build (matrix: ubuntu-latest, windows-latest)
#     1. cargo fmt --all --check
#     2. cargo clippy --all-targets -- -D warnings
#     3. cargo test --workspace
#     4. cargo build --release --workspace
#     5. 收集 target/release 下的产物:
#          .dll/.exe/.exp/.lib/.pdb/.d/.rlib/.so/.a (Windows)
#          .so/.rlib/.d/.a        (Linux)
#        仅收集文件,不收入目录结构。
#     6. 打包为 tar.gz (Linux) / zip (Windows) 并作为 release artifact 上传。
#
# 注: test21/test25 JNI/FFM 冒烟测试在 ci.yml 单独覆盖,此处不重复,
#     本工作流聚焦于"全量任务 + 产物打包"。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.4). Leave empty to skip GitHub Release upload.'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace

      # ------------------------------------------------------------------
      # 收集 target/release 下与 crate 产物相关的文件 (act.ext 枚举),
      # 忽略目录、构建脚本中间产物及 cargo 自身的 lock/build 脚本。
      # 只保留文件本身,不保留目录层级。
      # ------------------------------------------------------------------
      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          # 与 crate 产物相关的扩展名 (不含目录)
          EXTENSIONS="dll exe exp lib pdb rlib so a dylib d"
          # 仅 target/release 顶层 (不深入 .fingerprint / build / deps 子目录,
          # 避免收入重复的依赖缓存中间产物;crate 最终产物总在 release 顶层)
          pushd target/release >/dev/null
          for ext in $EXTENSIONS; do
            find . -maxdepth 1 -type f -name "*.${ext}" -print0 \
              | while IFS= read -r -d '' f; do
                  cp "$f" "${GITHUB_WORKSPACE}/_artifacts/"
                done
          done
          # 也收集 cbindgen 生成的 C 头文件 (若有)
          if [ -f "${GITHUB_WORKSPACE}/crates/mps-core/include/rigid_body.h" ]; then
            cp "${GITHUB_WORKSPACE}/crates/mps-core/include/rigid_body.h" \
               "${GITHUB_WORKSPACE}/_artifacts/"
          fi
          popd >/dev/null
          echo "## Collected artifacts ##"
          ls -la _artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          EXTENSIONS="dll exe exp lib pdb rlib so a dylib d"
          pushd target/release >/dev/null
          for ext in $EXTENSIONS; do
            find . -maxdepth 1 -type f -name "*.${ext}" -print0 \
              | while IFS= read -r -d '' f; do
                  cp "$f" "${GITHUB_WORKSPACE}/_artifacts/"
                done
          done
          popd >/dev/null
          if [ -f "${GITHUB_WORKSPACE}/crates/mps-core/include/rigid_body.h" ]; then
            cp "${GITHUB_WORKSPACE}/crates/mps-core/include/rigid_body.h" \
               "${GITHUB_WORKSPACE}/_artifacts/"
          fi
          echo "## Collected artifacts ##"
          ls -la _artifacts/

      # ------------------------------------------------------------------
      # 打包: Linux 用 tar.gz, Windows 用 zip
      # ------------------------------------------------------------------
      - name: Create tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          ARTIFACT_NAME="mps-rigid-body-$(git rev-parse --short HEAD)-linux-x86_64"
          tar -czf "${ARTIFACT_NAME}.tar.gz" -C _artifacts .
          echo "ARTIFACT_PATH=${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"
          ls -la "${ARTIFACT_NAME}.tar.gz"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARTIFACT_NAME="mps-rigid-body-$(git rev-parse --short HEAD)-windows-x86_64"
          (cd _artifacts && 7z a "../${ARTIFACT_NAME}.zip" ./*)
          echo "ARTIFACT_PATH=${ARTIFACT_NAME}.zip" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}.zip" >> "$GITHUB_ENV"
          ls -la "${ARTIFACT_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 30
          if-no-files-found: error

  # ======================================================================
  # 在 tag 推送或手动指定 tag 时,把两个平台的产物合并到 GitHub Release
  # ======================================================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing release for tag: ${TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _release
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: _release/*
          fail_on_unmatched_files: false
