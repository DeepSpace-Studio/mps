name: Deploy MPS Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crates/mps-web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and export static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mps-web
        run: cargo build -p mps-web --release

      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Start server and export static pages
        env:
          # Serve pages with <base href="/<repo>/"> so relative links like
          # ./quickstart resolve under the GitHub Pages sub-path.
          MPS_BASE_PATH: ${{ steps.configure-pages.outputs.base_path }}/
        run: |
          # Start the server in background on port 8080
          PORT=8080 ./target/release/mps-web &
          SERVER_PID=$!

          # Wait for the server to be ready (retry up to 10 times)
          for i in $(seq 1 10); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080/" 2>/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" = "10" ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Create output directory
          mkdir -p _site

          # Export all pages
          PAGES=(
            "/"
            "/quickstart"
            "/architecture"
            "/gravity"
            "/integrators"
            "/formula"
            "/voxel"
            "/events"
            "/arena"
            "/jni"
            "/ffm"
            "/api"
          )

          for page in "${PAGES[@]}"; do
            echo "Exporting $page ..."
            if [ "$page" = "/" ]; then
              outfile="_site/index.html"
            else
              mkdir -p "_site${page}"
              outfile="_site${page}/index.html"
            fi
            if ! curl -sf -o "$outfile" "http://127.0.0.1:8080${page}"; then
              echo "ERROR: Failed to export $page"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done

          # Kill the server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "Static export complete."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5