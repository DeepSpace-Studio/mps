name: Deploy MPS Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crates/mps-web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and export static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Build mps-web
        # Dioxus 0.7's `dioxus_cli_config::base_path()` reads
        # `DIOXUS_ASSET_ROOT` at *compile time* in release builds via
        # `option_env!`, baking the base path into the binary. We must
        # therefore export the env var during `cargo build` (not just at
        # run time) so the SSR router knows to nest routes under the
        # Pages sub-path and prefix all internal `<Link>` hrefs.
        #
        # `configure-pages` returns `/$(basename ${{ github.repository }})`
        # for project pages (e.g. `/rigid-body` here, `/some-fork-name`
        # for a repo named `some-fork-name`). It returns an empty string
        # for user/org home pages and custom-domain deployments, in
        # which case Dioxus serves at `/` with no prefix. This makes the
        # export fork-compatible: fork the repo → enable Actions + Pages
        # → base_path auto-adapts to the fork's name.
        env:
          DIOXUS_ASSET_ROOT: ${{ steps.configure-pages.outputs.base_path }}
        run: cargo build -p mps-web --release

      - name: Start server and export static pages
        env:
          # Passed again at run time for clarity / future debug-build support.
          DIOXUS_ASSET_ROOT: ${{ steps.configure-pages.outputs.base_path }}
        run: |
          # Start the server in background on port 8080
          PORT=8080 ./target/release/mps-web &
          SERVER_PID=$!

          # Base path prefix Dioxus serves under (from DIOXUS_ASSET_ROOT /
          # GitHub Pages base_path). For project pages this is
          # `/<repo-name>` — auto-adapts when the repo is forked under a
          # different name. Empty for root / custom-domain deployments.
          SERVE_BASE="${{ steps.configure-pages.outputs.base_path }}"
          SERVE_BASE="${SERVE_BASE%/}"

          # Wait for the server to be ready (retry up to 10 times)
          for i in $(seq 1 10); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080${SERVE_BASE}/" 2>/dev/null; then
              echo "Server ready after ${i}s (serving under ${SERVE_BASE:-/})"
              break
            fi
            if [ "$i" = "10" ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Create output directory
          mkdir -p _site

          # All pages registered in lib.rs (kept in sync manually —
          # new pages must be added to both lib.rs and this list).
          # These are the Dioxus Router paths (without the base-path prefix).
          PAGES=(
            "/"
            "/quickstart"
            "/architecture"
            "/gravity"
            "/integrators"
            "/formula"
            "/voxel"
            "/events"
            "/arena"
            "/batch"
            "/cosmos"
            "/jni"
            "/ffm"
            "/api"
            "/404"
          )

          BASE_URL="${{ steps.configure-pages.outputs.base_url }}"
          # Fallback for local testing (rare): derive from github.repository
          # owner/name, e.g. "owner/repo" → "https://owner.github.io/repo".
          if [ -z "$BASE_URL" ]; then
            REPO="${{ github.repository }}"
            OWNER="${REPO%%/*}"
            NAME="${REPO#*/}"
            BASE_URL="https://${OWNER}.github.io/${NAME}"
          fi
          BASE_URL="${BASE_URL%/}"

          for page in "${PAGES[@]}"; do
            echo "Exporting ${SERVE_BASE}${page} ..."
            if [ "$page" = "/" ]; then
              outfile="_site/index.html"
            else
              mkdir -p "_site${page}"
              outfile="_site${page}/index.html"
            fi
            if ! curl -sf -o "$outfile" "http://127.0.0.1:8080${SERVE_BASE}${page}"; then
              echo "ERROR: Failed to export ${SERVE_BASE}${page}"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done

          # Generate sitemap.xml
          echo '<?xml version="1.0" encoding="UTF-8"?>' > _site/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> _site/sitemap.xml
          for page in "${PAGES[@]}"; do
            if [ "$page" = "/404" ]; then continue; fi
            echo "  <url>" >> _site/sitemap.xml
            echo "    <loc>${BASE_URL}${page}/</loc>" >> _site/sitemap.xml
            echo "    <changefreq>weekly</changefreq>" >> _site/sitemap.xml
            echo "    <priority>$( [ "$page" = "/" ] && echo 1.0 || echo 0.8 )</priority>" >> _site/sitemap.xml
            echo "  </url>" >> _site/sitemap.xml
          done
          echo '</urlset>' >> _site/sitemap.xml
          echo "Generated sitemap.xml"

          # Generate robots.txt
          echo "User-agent: *" > _site/robots.txt
          echo "Allow: /" >> _site/robots.txt
          echo "Sitemap: ${BASE_URL}/sitemap.xml" >> _site/robots.txt
          echo "Generated robots.txt"

          # Kill the server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "Static export complete."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
