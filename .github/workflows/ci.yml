# ci.yml — mps_rigid_body 主 CI 流水线
#
# 触发条件:
#   - push 到 main 分支
#   - 任意 PR 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 作业:
#   1. rust  — cargo fmt, clippy, test, build --release (纯 Rust)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  # ==========================================================================
  # Rust: fmt + clippy + test + build --release
  # ==========================================================================

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      # cbindgen is pinned in Cargo.lock, so the generated header must be reproducible.
      # Skip on Windows: git autocrlf could report spurious line-ending diffs.
      - name: Check generated C header is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          git diff --exit-code crates/mps-core/include/rigid_body.h
