# ci.yml — mps_rigid_body 主 CI 流水线
#
# 触发条件:
#   - push 到 main 分支
#   - 任意 PR 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 作业:
#   1. rust  — cargo fmt, clippy, test, build --release (纯 Rust)
#   2. java21 — test21 Gradle smoke test (需要 JDK 21 + cargo build --release -p mps-jni)
#   3. java25 — test25 Gradle smoke test (需要 JDK 25 + cargo build --release -p mps-jni)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  # ==========================================================================
  # Rust: fmt + clippy + test + build --release
  # ==========================================================================

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      # cbindgen is pinned in Cargo.lock, so the generated header must be reproducible.
      # Skip on Windows: git autocrlf could report spurious line-ending diffs.
      - name: Check generated C header is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          git diff --exit-code crates/mps-core/include/rigid_body.h

  # ==========================================================================
  # Java 21 JNI smoke test
  # ==========================================================================

  java21:
    name: Java 21 JNI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JNI native library
        run: cargo build --release -p mps-jni

      - name: test21 Gradle check
        working-directory: test21
        run: ./gradlew check --no-daemon

  # ==========================================================================
  # Java 25 FFM smoke test
  # ==========================================================================

  java25:
    name: Java 25 FFM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JNI native library
        run: cargo build --release -p mps-jni

      - name: test25 Gradle check
        working-directory: test25
        run: ./gradlew check --no-daemon
